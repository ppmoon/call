description = "Local Sidecar for the Call VS Code extension: JSON-RPC over stdio"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "=0.24.7"
tree-sitter-python = "=0.23.6"
